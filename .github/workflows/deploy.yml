name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Import check
        # DB 접속 없는 import 검사 전용 값이며 배포 단계에는 전달하지 않습니다.
        env:
          DATABASE_URL: postgresql+asyncpg://ci:ci@127.0.0.1:5432/moa_ci
          JWT_SECRET_KEY: ci-only-import-check-signing-key-not-for-deployment
        run: python -c "from app.main import app; print(app.title)"

  deploy:
    # main에 push될 때만 배포 (PR에서는 실행되지 않음)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    concurrency: deploy-production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy over SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          # 붙여넣기 과정에서 섞인 공백/줄바꿈/따옴표 제거
          SSH_HOST=$(printf '%s' "$SSH_HOST" | tr -d '[:space:]"'"'")
          SSH_USER=$(printf '%s' "$SSH_USER" | tr -d '[:space:]"'"'")
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$SSH_KEY" ]; then
            echo "SSH_HOST / SSH_USER / SSH_KEY secret 중 비어 있는 값이 있습니다." >&2
            exit 1
          fi
          if [ -z "$ENV_FILE" ]; then
            echo "ENV_FILE secret이 비어 있습니다." >&2
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          # .env 원문은 로그·명령 인자에 넣지 않고 SSH stdin으로만 전달한다.
          printf '%s' "$ENV_FILE" | \
            ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" \
              'cd ~/moa-backend && git fetch --quiet origin main </dev/null && git reset --hard origin/main </dev/null && exec bash scripts/deploy.sh --env-file'
